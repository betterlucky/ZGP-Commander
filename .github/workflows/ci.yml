name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Fail the install if a dependency gains an install script not recorded
  # in package.json allowScripts, instead of silently skipping it.
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run check
